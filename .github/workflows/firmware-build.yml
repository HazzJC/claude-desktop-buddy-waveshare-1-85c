name: Firmware build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile Waveshare 1.85C firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Compile firmware (no upload)
        run: pio run -e waveshare-esp32s3-touch-lcd-1-85c-v2
